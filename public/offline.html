<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#34796f">
    <title>LevelUp · Sin conexión</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f5f0; color: #20322f; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px; background: #f7f5f0; }
      main { width: min(100%, 360px); padding: 30px 24px; border: 1px solid #e4e8e2; border-radius: 24px; text-align: center; background: #fffdf9; box-shadow: 0 14px 34px rgba(40, 62, 57, .07); }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 15px; color: #fff; background: #34796f; font-size: 25px; font-weight: 700; }
      h1 { margin: 0; font-size: 27px; letter-spacing: -.05em; }
      p { margin: 10px 0 22px; color: #536461; font-size: 14px; line-height: 1.5; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 13px; color: #fff; background: #34796f; font-size: 14px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>Estás sin conexión</h1>
      <p>LevelUp todavía no está disponible en este dispositivo. Conéctate a internet e inténtalo de nuevo.</p>
      <a href="/">Intentar de nuevo</a>
    </main>
  </body>
</html>
